# Vote SA — configuration de PRODUCTION de https://sa.zurcher.edu.mg
#
# Remplace le site statique créé par Certbot le 14/09/2026. Le certificat Let's Encrypt EXISTANT est conservé
# (renouvelé par certbot.timer). Installé par deploy/server-setup.sh, qui sauvegarde l'ancienne version et refuse de
# recharger nginx si `nginx -t` échoue.
#
# Une seule origine : nginx sert le SPA (fichiers statiques, y compris /admin) et passe /api à Laravel (PHP-FPM, pool
# par défaut, comme le registrar). Même origine = pas de CORS.

# Limitation de débit par IP : protège la connexion et le vote contre un martèlement.
limit_req_zone $binary_remote_addr zone=sa_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sa.zurcher.edu.mg;

    # Le renouvellement du certificat (plugin nginx de certbot) ajoute ici son propre « location » pour le défi HTTP-01 :
    # il l'emporte sur celui-ci. Ne pas remplacer par un « return » au niveau du serveur, qui bloquerait le renouvellement.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sa.zurcher.edu.mg;

    ssl_certificate /etc/letsencrypt/live/sa.zurcher.edu.mg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sa.zurcher.edu.mg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sa/web/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 6m;          # photo du candidat (4 Mo max côté admin) + marge

    include snippets/sa-security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- Laravel : API (dont l'API d'administration /api/admin) et santé
    location ^~ /api/ { try_files /dev/null @laravel; }
    location = /up { try_files /dev/null @laravel; }

    # Connexion de la commission : limitée par IP (en plus du throttle de Laravel, 5/min).
    location = /api/admin/login {
        limit_req zone=sa_auth burst=5 nodelay;
        try_files /dev/null @laravel;
    }

    # Connexion Google : limitée par IP (en plus du throttle de Laravel).
    location = /api/auth/google {
        limit_req zone=sa_auth burst=20 nodelay;
        try_files /dev/null @laravel;
    }

    # ANONYMAT : on ne journalise pas les dépôts de bulletin. L'IP et l'heure d'une requête de vote
    # dans access.log ne doivent pas pouvoir être recoupées avec quoi que ce soit d'autre.
    location = /api/vote {
        access_log off;
        limit_req zone=sa_auth burst=20 nodelay;
        try_files /dev/null @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/sa/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 30s;
    }

    # --- Fichiers publics de Laravel : photos des candidats
    location ^~ /storage/ {
        alias /var/www/sa/api/storage/app/public/;
        add_header Cache-Control "public, max-age=604800";
        include snippets/sa-security-headers.conf;
        access_log off;
    }

    # --- SPA : fichiers hachés = cache à vie ; ceux qui pilotent les mises à jour ne sont JAMAIS mis en cache.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/sa-security-headers.conf;
        access_log off;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include snippets/sa-security-headers.conf;
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/sa-security-headers.conf;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/sa-security-headers.conf;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;   # absent de mime.types d'Ubuntu : sinon application/octet-stream
        add_header Cache-Control "no-cache";
        include snippets/sa-security-headers.conf;
    }

    # Tout le reste est une route du SPA (React Router).
    location / {
        try_files $uri /index.html;
    }

    # Jamais de fichiers cachés (.env, .git…).
    location ~ /\.(?!well-known) { deny all; }
}
