# En-têtes de sécurité communs. nginx n'hérite PAS des add_header du serveur dans un location qui en définit
# un lui-même : ce fichier est donc inclus explicitement partout où c'est nécessaire.
# Pas de Content-Security-Policy ici : elle doit autoriser Google Identity Services (accounts.google.com)
# et être validée avec le vrai bouton de connexion avant d'être activée.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
